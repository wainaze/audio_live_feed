name: Build Raspberry Pi Disk Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Raspberry Pi OS Image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 1024
          copy_repository_path: /home/pi/audio_live_feed
          commands: |
            # 1. Install system packages
            apt-get update
            apt-get install -y python3 python3-venv python3-pip portaudio19-dev python3-dev network-manager avahi-daemon git

            # 2. Set hostname offline (without dbus)
            echo "livefeed" > /etc/hostname
            sed -i 's/127\.0\.1\.1.*/127.0.1.1\tlivefeed/g' /etc/hosts || true

            # 3. Ensure pi user exists
            id -u pi &>/dev/null || useradd -m -s /bin/bash pi

            # 4. Setup Python venv and install dependencies
            cd /home/pi/audio_live_feed
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # 5. Install and enable systemd service offline
            cp audio-live-feed.service /etc/systemd/system/audio-live-feed.service
            mkdir -p /etc/systemd/system/multi-user.target.wants
            ln -sf /etc/systemd/system/audio-live-feed.service /etc/systemd/system/multi-user.target.wants/audio-live-feed.service

            # 6. Set correct permissions
            chown -R pi:pi /home/pi/audio_live_feed

      - name: Compress image with XZ
        run: |
          echo "[*] Compressing disk image: ${{ steps.build_image.outputs.image }}"
          xz -9 -T0 -c "${{ steps.build_image.outputs.image }}" > audio-live-feed-rpi.img.xz

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-live-feed-rpi-image
          path: audio-live-feed-rpi.img.xz

      - name: Release Image Asset (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio-live-feed-rpi.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
