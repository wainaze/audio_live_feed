name: Build Raspberry Pi Disk Image
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Raspberry Pi OS Image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:bookworm
          image_additional_mb: 1024
          copy_repository_path: /home/pi/audio_live_feed
          commands: |
            # 1. Install system packages
            apt-get update
            apt-get install -y python3 python3-venv python3-pip portaudio19-dev python3-dev network-manager wpasupplicant wireless-regdb iw avahi-daemon git sudo openssh-server rfkill iptables dnsmasq-base
            # 2. Set hostname
            echo "livefeed" > /etc/hostname
            sed -i 's/127\.0\.1\.1.*/127.0.1.1\tlivefeed/g' /etc/hosts || true
            # 3. Create 'pi' user with default password 'raspberry' & full permissions
            id -u pi &>/dev/null || useradd -m -s /bin/bash pi
            echo "pi:raspberry" | chpasswd
            echo -e "raspberry\nraspberry" | passwd pi 2>/dev/null || true
            usermod -aG sudo,audio,video,netdev,plugdev,dialout,input,render pi
            echo "pi ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/010_pi-nopasswd
            chmod 0440 /etc/sudoers.d/010_pi-nopasswd
            # 4. Enable OpenSSH password authentication explicitly
            mkdir -p /etc/ssh/sshd_config.d
            printf "PasswordAuthentication yes\nPermitRootLogin yes\nKbdInteractiveAuthentication yes\n" > /etc/ssh/sshd_config.d/01-allow-password.conf
            sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
            # 5. Enable SSH and NetworkManager services on boot
            mkdir -p /etc/systemd/system/multi-user.target.wants
            ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service || true
            ln -sf /lib/systemd/system/sshd.service /etc/systemd/system/multi-user.target.wants/sshd.service || true
            ln -sf /lib/systemd/system/NetworkManager.service /etc/systemd/system/multi-user.target.wants/NetworkManager.service || true
            ln -sf /lib/systemd/system/avahi-daemon.service /etc/systemd/system/multi-user.target.wants/avahi-daemon.service || true
            # 6. Enable SSH and user in boot partitions for Raspberry Pi OS first-boot scripts
            if [ -d /boot/firmware ]; then
              touch /boot/firmware/ssh
              echo "pi:\$6\$4bZk1wI909yP1P2g\$l6YFj9hT1vFm9c6WjXqNlJ4vJg5CgQ1nUu8s8E4mNqT9p.H.m7B1F3C4v0u1e.Y3f5g7h8i9j0k1l2m3n4/" > /boot/firmware/userconf.txt
            fi
            if [ -d /boot ]; then
              touch /boot/ssh
              echo "pi:\$6\$4bZk1wI909yP1P2g\$l6YFj9hT1vFm9c6WjXqNlJ4vJg5CgQ1nUu8s8E4mNqT9p.H.m7B1F3C4v0u1e.Y3f5g7h8i9j0k1l2m3n4/" > /boot/userconf.txt
            fi
            # 7. Unblock Wi-Fi & Set Default Wi-Fi Country
            systemctl mask systemd-rfkill.service || true
            mkdir -p /etc/wpa_supplicant
            printf "country=US\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\nupdate_config=1\n" > /etc/wpa_supplicant/wpa_supplicant.conf
            chmod 600 /etc/wpa_supplicant/wpa_supplicant.conf || true
            # 8. Create hotspot-startup.sh with active hardware detection loop
            printf '#!/usr/bin/env bash\nfor i in $(seq 1 30); do\n  rfkill unblock all 2>/dev/null || true\n  if nmcli general status >/dev/null 2>&1 && nmcli device status 2>/dev/null | grep -E "wifi|wlan" >/dev/null 2>&1; then\n    break\n  fi\n  sleep 1\ndone\n\nnmcli radio wifi on 2>/dev/null || true\nsleep 2\nnmcli connection delete "Live Feed" 2>/dev/null || true\nnmcli connection delete "Live Feed Hotspot" 2>/dev/null || true\nnmcli device wifi hotspot ssid "Live Feed" password "12345678" 2>/dev/null || true\n' > /home/pi/audio_live_feed/hotspot-startup.sh
            chmod +x /home/pi/audio_live_feed/hotspot-startup.sh /home/pi/audio_live_feed/start.sh 2>/dev/null || true
            # 9. Create hotspot-startup.service
            printf '[Unit]\nDescription=Ensure Wi-Fi Hotspot Broadcasts on Boot\nAfter=NetworkManager.service\nWants=NetworkManager.service\n\n[Service]\nsType=oneshot\nRemainAfterExit=yes\nExecStart=/home/pi/audio_live_feed/hotspot-startup.sh\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/hotspot-startup.service
            ln -sf /etc/systemd/system/hotspot-startup.service /etc/systemd/system/multi-user.target.wants/hotspot-startup.service
            # 10. Setup Python venv and install dependencies
            cd /home/pi/audio_live_feed
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            # 11. Install and enable audio live feed systemd service
            cp audio-live-feed.service /etc/systemd/system/audio-live-feed.service
            ln -sf /etc/systemd/system/audio-live-feed.service /etc/systemd/system/multi-user.target.wants/audio-live-feed.service
            # 12. Set correct file permissions
            chown -R pi:pi /home/pi/audio_live_feed
      - name: Compress image with XZ
        run: |
          echo "[*] Compressing disk image: ${{ steps.build_image.outputs.image }}"
          xz -9 -T0 -c "${{ steps.build_image.outputs.image }}" > audio-live-feed-rpi.img.xz
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-live-feed-rpi-image
          path: audio-live-feed-rpi.img.xz
      - name: Release Image Asset (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio-live-feed-rpi.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
