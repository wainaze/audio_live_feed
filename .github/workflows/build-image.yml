name: Build Raspberry Pi Disk Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: # Enables a manual "Run workflow" button in the Actions tab

jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (QEMU & Libguestfs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libguestfs-tools xz-utils curl

      - name: Download official Raspberry Pi OS Lite image
        run: |
          echo "[*] Downloading official Raspberry Pi OS Lite (64-bit)..."
          curl -L -o raspios.img.xz "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz"
          echo "[*] Decompressing..."
          unxz raspios.img.xz

      - name: Resize image
        run: |
          qemu-img resize -f raw raspios.img +1G
          sudo virt-resize --expand /dev/sda2 raspios.img raspios_expanded.img
          mv raspios_expanded.img raspios.img

      - name: Inject application into image
        run: |
          sudo guestfish --rw -a raspios.img -i <<'EOF'
          mkdir -p /home/pi/audio_live_feed
          copy-in . /home/pi/audio_live_feed
          chown 1000 1000 /home/pi/audio_live_feed
          EOF

      - name: Run install script inside image
        run: |
          sudo systemd-nspawn -D /tmp/rootfs --bind=/usr/bin/qemu-aarch64-static /bin/bash <<'EOF'
          cd /home/pi/audio_live_feed
          bash install.sh
          EOF

      - name: Compress final image
        run: |
          echo "[*] Compressing disk image with XZ..."
          xz -9 -T0 -c raspios.img > audio-live-feed-rpi.img.xz

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-live-feed-rpi-image
          path: audio-live-feed-rpi.img.xz

      - name: Release Image Asset (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: audio-live-feed-rpi.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
