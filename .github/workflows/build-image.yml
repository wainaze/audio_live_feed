name: Build Raspberry Pi Disk Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Raspberry Pi OS Image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 1024
          copy_repository_path: /home/pi/audio_live_feed
          commands: |
            # 1. Install system packages
            apt-get update
            apt-get install -y python3 python3-venv python3-pip portaudio19-dev python3-dev network-manager avahi-daemon git sudo openssh-server rfkill

            # 2. Set hostname offline (without dbus)
            echo "livefeed" > /etc/hostname
            sed -i 's/127\.0\.1\.1.*/127.0.1.1\tlivefeed/g' /etc/hosts || true

            # 3. Create 'pi' user with default password 'raspberry' & full sudo/audio/netdev permissions
            id -u pi &>/dev/null || useradd -m -s /bin/bash pi
            echo "pi:raspberry" | chpasswd
            usermod -aG sudo,audio,video,netdev,plugdev,dialout,input,render pi
            echo "pi ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/010_pi-nopasswd
            chmod 0440 /etc/sudoers.d/010_pi-nopasswd

            # 4. Enable SSH and NetworkManager on boot out of the box
            mkdir -p /etc/systemd/system/multi-user.target.wants
            ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service || true
            ln -sf /lib/systemd/system/sshd.service /etc/systemd/system/multi-user.target.wants/sshd.service || true
            ln -sf /lib/systemd/system/NetworkManager.service /etc/systemd/system/multi-user.target.wants/NetworkManager.service || true
            ln -sf /lib/systemd/system/avahi-daemon.service /etc/systemd/system/multi-user.target.wants/avahi-daemon.service || true

            # 5. Enable SSH and user in boot partitions for Raspberry Pi OS first-boot scripts
            if [ -d /boot/firmware ]; then
              touch /boot/firmware/ssh
              echo "pi:\$6\$4bZk1wI909yP1P2g\$l6YFj9hT1vFm9c6WjXqNlJ4vJg5CgQ1nUu8s8E4mNqT9p.H.m7B1F3C4v0u1e.Y3f5g7h8i9j0k1l2m3n4/" > /boot/firmware/userconf.txt
            fi
            if [ -d /boot ]; then
              touch /boot/ssh
              echo "pi:\$6\$4bZk1wI909yP1P2g\$l6YFj9hT1vFm9c6WjXqNlJ4vJg5CgQ1nUu8s8E4mNqT9p.H.m7B1F3C4v0u1e.Y3f5g7h8i9j0k1l2m3n4/" > /boot/userconf.txt
            fi

            # 6. Unblock Wi-Fi & Set Default Wi-Fi Country (prevents RFKill soft-block)
            mkdir -p /etc/wpa_supplicant
            cat << 'EOF' > /etc/wpa_supplicant/wpa_supplicant.conf
country=US
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
EOF
            chmod 600 /etc/wpa_supplicant/wpa_supplicant.conf || true

            # 7. Setup Python venv and install dependencies
            cd /home/pi/audio_live_feed
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # 8. Install and enable systemd service offline
            cp audio-live-feed.service /etc/systemd/system/audio-live-feed.service
            ln -sf /etc/systemd/system/audio-live-feed.service /etc/systemd/system/multi-user.target.wants/audio-live-feed.service

            # 9. Set correct permissions
            chown -R pi:pi /home/pi/audio_live_feed

      - name: Compress image with XZ
        run: |
          echo "[*] Compressing disk image: ${{ steps.build_image.outputs.image }}"
          xz -9 -T0 -c "${{ steps.build_image.outputs.image }}" > audio-live-feed-rpi.img.xz

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-live-feed-rpi-image
          path: audio-live-feed-rpi.img.xz

      - name: Release Image Asset (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio-live-feed-rpi.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
